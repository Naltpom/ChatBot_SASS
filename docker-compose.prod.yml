# Compose de PRODUCTION : pas de bind mount de sources, pas de reload, bundle
# statique servi par nginx. Secrets injectés par l'environnement (.env) —
# POSTGRES_PASSWORD, JWT_SECRET_KEY et ENCRYPTION_KEY sont OBLIGATOIRES.
# Lancement : docker compose -f docker-compose.prod.yml up -d --build
services:
  db:
    # pgvector/pgvector:pg15 = postgres:15 + extension vector (RAG kb_chunks)
    image: pgvector/pgvector:pg15
    container_name: chatbot-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD obligatoire en production}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Pas de port exposé sur l'hôte : la base n'est joignable que depuis le réseau compose.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: chatbot-redis
    restart: unless-stopped
    # appendonly : persiste les fenêtres de rate-limit entre les redémarrages.
    # Pas de port exposé sur l'hôte : joignable uniquement depuis le réseau compose.
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: chatbot-api
    restart: unless-stopped
    environment:
      - ENV=production
      - DATABASE_URL=${DATABASE_URL}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:?JWT_SECRET_KEY obligatoire en production}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:?ENCRYPTION_KEY obligatoire en production}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - TURNSTILE_SITE_KEY=${TURNSTILE_SITE_KEY:-}
      - TURNSTILE_SECRET_KEY=${TURNSTILE_SECRET_KEY:-}
      # Démo publique « 1 URL -> chatbot » (défauts sains, surcharge optionnelle).
      - DEMO_ENABLED=${DEMO_ENABLED:-true}
      - DEMO_IP_PER_DAY=${DEMO_IP_PER_DAY:-5}
      - DEMO_GLOBAL_PER_DAY=${DEMO_GLOBAL_PER_DAY:-300}
      - DEMO_CACHE_TTL_DAYS=${DEMO_CACHE_TTL_DAYS:-14}
      # Chat IA de la démo (V2) : quotas par message.
      - DEMO_CHAT_IP_PER_DAY=${DEMO_CHAT_IP_PER_DAY:-30}
      - DEMO_CHAT_GLOBAL_PER_DAY=${DEMO_CHAT_GLOBAL_PER_DAY:-2000}
      - MOCK_AI=${MOCK_AI:-false}
      # Facturation Stripe (go-live). Vides => billing OFF (app gratuite). MOCK_BILLING
      # défaut false = sûr en prod ; métrage IA off par défaut (activable plus tard).
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY:-}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET:-}
      # Boutique de partitions (music.chapote.fr) : webhook Stripe DÉDIÉ (son propre
      # secret), jeton d'envoi des partitions par la production, URL publique.
      - STRIPE_MUSIC_WEBHOOK_SECRET=${STRIPE_MUSIC_WEBHOOK_SECRET:-}
      - MUSIC_INGEST_TOKEN=${MUSIC_INGEST_TOKEN:-}
      - MUSIC_URL=${MUSIC_URL:-https://music.chapote.fr}
      - MUSIC_DIR=/app/music_files
      - MOCK_BILLING=${MOCK_BILLING:-false}
      - BILLING_ENFORCE=${BILLING_ENFORCE:-true}
      - BILLING_METERING_ENABLED=${BILLING_METERING_ENABLED:-false}
      # URLs publiques (CORS dashboard + snippets d'intégration).
      - APP_URL=${APP_URL}
      - API_URL=${API_URL}
      # SSO Google : Client ID public (= audience des tokens). Vide = désactivé.
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      # Module TikTok « Chapote Publisher » (Espace client /app/tiktok). Clés de
      # l'app TikTok ; vides = module désactivé.
      - TIKTOK_CLIENT_KEY=${TIKTOK_CLIENT_KEY:-}
      - TIKTOK_CLIENT_SECRET=${TIKTOK_CLIENT_SECRET:-}
      - TIKTOK_REDIRECT_URI=${TIKTOK_REDIRECT_URI:-https://chapote.fr/tiktok/callback}
      - TIKTOK_MAX_UPLOAD_MB=${TIKTOK_MAX_UPLOAD_MB:-1024}
      - TIKTOK_SERVICE_TOKEN=${TIKTOK_SERVICE_TOKEN:-}
      - TIKTOK_SERVICE_USER_EMAIL=${TIKTOK_SERVICE_USER_EMAIL:-}
      - YOUTUBE_CLIENT_ID=${YOUTUBE_CLIENT_ID:-}
      - YOUTUBE_CLIENT_SECRET=${YOUTUBE_CLIENT_SECRET:-}
      - YOUTUBE_REDIRECT_URI=${YOUTUBE_REDIRECT_URI:-https://chapote.fr/youtube/callback}
      - YOUTUBE_MAX_UPLOAD_MB=${YOUTUBE_MAX_UPLOAD_MB:-1024}
      - YOUTUBE_DAILY_POSTS=${YOUTUBE_DAILY_POSTS:-6}
      - YOUTUBE_SERVICE_TOKEN=${YOUTUBE_SERVICE_TOKEN:-}
      - YOUTUBE_SERVICE_USER_EMAIL=${YOUTUBE_SERVICE_USER_EMAIL:-}
      # SMTP (envoi des emails : leads, demandes de conseiller, prospection).
      # HOST vide = fallback log, jamais bloquant (les emails ne partent PAS).
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_FROM=${SMTP_FROM:-}
      # Prospection commerciale (back-office superadmin). API publique gratuite
      # recherche-entreprises (SIRENE), aucune clé. Brouillon = ANTHROPIC_API_KEY
      # (ou MOCK_AI), envoi = SMTP ci-dessus. Défauts sains, surcharge optionnelle.
      - PROSPECTING_ENABLED=${PROSPECTING_ENABLED:-true}
      - RECHERCHE_ENTREPRISES_URL=${RECHERCHE_ENTREPRISES_URL:-https://recherche-entreprises.api.gouv.fr/search}
      - PROSPECT_CRAWL_MAX_PAGES=${PROSPECT_CRAWL_MAX_PAGES:-6}
      - PROSPECT_CRAWL_MAX_REDIRECTS=${PROSPECT_CRAWL_MAX_REDIRECTS:-4}
      - PROSPECT_FETCH_MAX_BYTES=${PROSPECT_FETCH_MAX_BYTES:-300000}
      # Brave Search (découverte web à la demande). Vide = web off, repli SIRENE.
      - BRAVE_SEARCH_API_KEY=${BRAVE_SEARCH_API_KEY:-}
      - PROSPECT_DISCOVER_MAX=${PROSPECT_DISCOVER_MAX:-10}
      # 2FA (TOTP + WebAuthn/passkeys). RP_ID dérivé de APP_URL si vide (host).
      # TWOFA_ENFORCE_ADMIN=true => un superadmin sans 2FA est bloqué sur /api/admin/*.
      - TWOFA_ISSUER=${TWOFA_ISSUER:-Chapote}
      - TWOFA_ENFORCE_ADMIN=${TWOFA_ENFORCE_ADMIN:-true}
      - WEBAUTHN_RP_ID=${WEBAUTHN_RP_ID:-}
      - WEBAUTHN_RP_NAME=${WEBAUTHN_RP_NAME:-Chapote}
      # Rate-limiters partagés via Redis : prérequis du multi-worker ci-dessous.
      # Si Redis tombe, repli mémoire fail-open (limites par process, dégradé
      # mais le produit reste up).
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      # Embeddings locaux (RAG) : cache du modele fastembed (volume nomme).
      # Changer de modele peut changer la dimension (la base attend vector(384)).
      - FASTEMBED_CACHE_PATH=${FASTEMBED_CACHE_PATH:-/var/cache/fastembed}
      - EMBEDDINGS_MODEL=${EMBEDDINGS_MODEL:-sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2}
      - PYTHONUNBUFFERED=1
    # API exposée derrière un reverse proxy (TLS) sur l'hôte : bind loopback
    # uniquement (127.0.0.1), le HTTP en clair ne doit jamais être joignable
    # depuis l'extérieur.
    ports:
      - "127.0.0.1:${API_PORT:-8001}:8000"
    volumes:
      # Seuls les uploads (volume nommé) et le widget statique (lecture seule) :
      # aucune source montée, le code vit dans l'image.
      - upload_files:/app/uploads
      # Partitions de la boutique (PDF complets + aperçus) : PRIVÉ, jamais servi tel quel.
      - music_files:/app/music_files
      - ./widget:/app/widget:ro
      # Cache du modele d'embeddings (download au premier usage, ~100-400 Mo)
      - fastembed_cache:/var/cache/fastembed
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Multi-worker possible : les rate-limiters sont partagés via Redis
    # (REDIS_URL). API_WORKERS ajuste le nombre de workers uvicorn.
    # TRUSTED_PROXY_IPS : IP(s) du reverse proxy autorisées à poser X-Forwarded-*.
    # ⚠ En prod, TRUSTED_PROXY_IPS DOIT être l'IP source réelle du reverse proxy
    # (jamais '*' : n'importe quel client pourrait usurper X-Forwarded-For).
    # Le défaut 127.0.0.1 n'est correct que si le proxy se connecte depuis
    # localhost (cas du bind loopback ci-dessous).
    command: uvicorn src.main:app --host 0.0.0.0 --port 8000 --workers ${API_WORKERS:-2} --proxy-headers --forwarded-allow-ips=${TRUSTED_PROXY_IPS:-127.0.0.1}
    # python:3.11-slim n'embarque pas curl -> healthcheck via urllib.
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health', timeout=3).status==200 else 1)\""]
      interval: 10s
      retries: 5
      start_period: 20s

  app:
    build:
      context: ./app
      dockerfile: Dockerfile.prod
      args:
        # Baké dans le bundle au build (import.meta.env.VITE_API_URL) :
        # doit pointer vers l'URL PUBLIQUE de l'API.
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8001}
        # SSO Google : même Client ID que côté API (valeur publique). Vide = bouton masqué.
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID:-}
        # Turnstile (démo /demo) : site key publique bakée. Défaut = la même que
        # TURNSTILE_SITE_KEY (clé publique du captcha widget déjà posée), pour
        # qu'une seule variable pilote front+back et éviter un 403 silencieux si
        # on oublie cette 3e variable. Vide = pas de captcha sur la démo.
        VITE_TURNSTILE_SITE_KEY: ${VITE_TURNSTILE_SITE_KEY:-${TURNSTILE_SITE_KEY:-}}
    container_name: chatbot-app
    restart: unless-stopped
    # Porte de maintenance (nginx) : redirige tout le monde vers la page de
    # maintenance SAUF les IP listées. Toggle sans rebuild (recrée le conteneur).
    environment:
      - MAINTENANCE_MODE=${MAINTENANCE_MODE:-on}
      - ALLOW_MAINTENANCE_IPS=${ALLOW_MAINTENANCE_IPS:-}
    # Bind loopback uniquement : le reverse proxy de l'hôte termine le TLS.
    ports:
      - "127.0.0.1:${APP_PORT:-3001}:80"
    depends_on:
      api:
        condition: service_healthy

  # Site music.chapote.fr (boutique de partitions) : bundle statique + relais
  # /api/music/ vers `api` (même origine). Le reverse proxy de l'hôte termine le
  # TLS de music.chapote.fr et envoie tout vers ce port (loopback uniquement).
  music:
    build:
      context: ./music
      dockerfile: Dockerfile
    container_name: chatbot-music
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MUSIC_PORT:-3002}:80"
    # Clé partagée avec l'API : le nginx de music lui transmet la vraie IP du visiteur
    # (X-Music-Client-IP) signée par cette clé ; l'API ne la croit que si la clé correspond.
    environment:
      - MUSIC_PROXY_KEY=${MUSIC_INGEST_TOKEN:-}
    depends_on:
      api:
        condition: service_healthy

  # Site cm.chapote.fr (gestion des réseaux sociaux) : bundle statique + relais
  # /api/cm/, /api/tiktok/, /api/youtube/ et de l'authentification vers `api`
  # (même origine). Le reverse proxy de l'hôte termine le TLS de cm.chapote.fr.
  cm:
    build:
      context: ./cm
      dockerfile: Dockerfile
    container_name: chatbot-cm
    restart: unless-stopped
    ports:
      - "127.0.0.1:${CM_PORT:-3003}:80"
    # Clé partagée avec l'API : vraie IP du visiteur (X-Cm-Client-IP) signée par cette clé.
    environment:
      - CM_PROXY_KEY=${CM_PROXY_KEY:-}
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  upload_files:
  fastembed_cache:
  music_files:

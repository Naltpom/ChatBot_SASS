# emails.chapote.fr — le reverse proxy de l'hôte (TLS, port 443) envoie tout ici.
# Modèle : l'image nginx remplace ${EMAILS_PROXY_KEY} au démarrage (envsubst, variables définies seulement).
#
# Relais vers `api` (même origine, pas de CORS) :
#   /api/emails/                 interface d'administration (superadmin + 2FA)
#   /api/auth/(login|google|…)   connexion du compte Chapote (SSO Google, 2FA TOTP / secours / passkey)
#   /mcp                         serveur MCP distant (connecteur claude.ai), Bearer OAuth
#   /oauth/, /.well-known/oauth-* OAuth 2.1 (découverte, inscription, autorisation, jetons)

map $uri $emails_cache_control {
    ~^/assets/         "public, max-age=31536000, immutable";
    ~^/api/            "";
    ~^/mcp             "";
    ~^/oauth/          "";
    ~^/\.well-known/   "";
    default            "no-cache";
}

# Journal sans paramètres d'URL : state, code_challenge, demande de consentement signée (?req=).
log_format emails_sans_params '$remote_addr - [$time_local] "$request_method $uri $server_protocol" '
                              '$status $body_bytes_sent "$http_user_agent"';

server {
    listen 80;
    access_log /var/log/nginx/access.log emails_sans_params;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;
    # Brouillons et envois MCP : corps de 200 000 caractères au plus.
    client_max_body_size 2m;

    set_real_ip_from 127.0.0.1;
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    add_header Cache-Control $emails_cache_control always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https:; style-src 'self' 'unsafe-inline' https://accounts.google.com/gsi/style; font-src 'self'; script-src 'self' https://accounts.google.com/gsi/client; frame-src https://accounts.google.com/gsi/; connect-src 'self' https://accounts.google.com/gsi/; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

    # Interface d'administration.
    location /api/emails/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Emails-Client-IP $remote_addr;
        proxy_set_header X-Emails-Proxy-Key "${EMAILS_PROXY_KEY}";
        # Test de connexion d'une boîte (IMAP puis SMTP, délais réseau compris).
        proxy_read_timeout 120s;
    }
    # Compte partagé avec chapote.fr : seules ces routes d'authentification sont exposées ici
    # (pas d'inscription : réservé au superadmin). Passkeys : même RP ID (chapote.fr).
    location ~ ^/api/auth/(login|google|logout|me|2fa/login/totp|2fa/login/recovery|2fa/login/webauthn/begin|2fa/login/webauthn/complete)$ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Emails-Client-IP $remote_addr;
        proxy_set_header X-Emails-Proxy-Key "${EMAILS_PROXY_KEY}";
    }
    location /api/ { return 404; }

    # Serveur MCP (Streamable HTTP). Appels de Claude depuis le cloud d'Anthropic : HTTPS 443 sur le
    # reverse proxy de l'hôte, puis ici. Pas de mise en mémoire tampon (flux éventuels), délais longs
    # (une recherche sur toutes les boîtes peut durer), en-têtes du protocole transmis tels quels.
    location = /mcp {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Emails-Client-IP $remote_addr;
        proxy_set_header X-Emails-Proxy-Key "${EMAILS_PROXY_KEY}";
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Mcp-Session-Id $http_mcp_session_id;
        proxy_set_header Mcp-Protocol-Version $http_mcp_protocol_version;
        proxy_set_header Last-Event-ID $http_last_event_id;
        proxy_buffering off;
        proxy_cache off;
        proxy_request_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        chunked_transfer_encoding on;
    }
    location = /mcp/ { return 308 /mcp; }

    # OAuth 2.1 : découverte (RFC 9728, RFC 8414), inscription, autorisation, jetons, révocation.
    location ^~ /.well-known/oauth- {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location ^~ /oauth/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Emails-Client-IP $remote_addr;
        proxy_set_header X-Emails-Proxy-Key "${EMAILS_PROXY_KEY}";
        proxy_set_header Authorization $http_authorization;
    }

    location /assets/ {
        try_files $uri =404;
    }
    location / {
        try_files $uri /index.html;
    }
}

# Configuration Alembic — migrations de schéma de l'API.
#
# L'URL de connexion N'EST PAS définie ici : alembic/env.py lit
# settings.DATABASE_URL (src.core.config), même source de vérité que l'app.
#
# Usage (toujours DANS le conteneur api, cwd /app) :
#   docker compose exec api alembic revision --autogenerate -m "description"
#   docker compose exec api alembic upgrade head
# Au démarrage, src/main.py exécute `upgrade head` automatiquement (lifespan).

[alembic]
# %(here)s = dossier de ce fichier (/app dans le conteneur) : les chemins
# restent valides quel que soit le cwd (CLI ou appel programmatique).
script_location = %(here)s/alembic
prepend_sys_path = %(here)s

# Fichiers de révision préfixés par la date : l'ordre chronologique se lit
# directement dans le dossier versions/.
file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(rev)s_%%(slug)s

# --- Logging (chargé par env.py via fileConfig, sans couper les loggers
# de l'application quand la migration tourne dans le lifespan FastAPI) ---

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

# INFO (et pas WARN comme le defaut Alembic) : fileConfig est aussi charge au
# demarrage de l'app (lifespan) et reconfigure le root logger — on conserve le
# niveau INFO que l'application avait via logging.basicConfig.
[logger_root]
level = INFO
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S

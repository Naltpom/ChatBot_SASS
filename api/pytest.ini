[pytest]
# Mode asyncio STRICT = comportement historique : chaque test async porte un
# `@pytest.mark.asyncio` explicite (on ne change donc RIEN aux 237 tests
# existants). Épinglé pour la reproductibilité (pytest-asyncio 1.x change de
# défaut entre versions).
asyncio_mode = strict

# Marqueurs déclarés (évite les warnings ; source unique, plus de double-emploi
# avec un pytest_configure).
markers =
    real_db: test nécessitant une vraie base Postgres jetable (fixtures pg_session/pg_engine) ; skip gracieux si la DB est injoignable, échec dur si REQUIRE_REAL_DB est défini.

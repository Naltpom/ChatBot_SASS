# Compose DE DÉVELOPPEMENT (bind mounts + reload). Production : docker-compose.prod.yml
services:
  db:
    # pgvector/pgvector:pg15 = postgres:15 + extension vector (RAG kb_chunks)
    image: pgvector/pgvector:pg15
    container_name: chatbot-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: chatbot-redis
    restart: unless-stopped
    # appendonly : persiste les fenetres de rate-limit entre les redémarrages
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Service one-shot : joue `alembic upgrade head` UNE fois, PUIS s'arrête.
  # Les migrations ne tournent PLUS dans le boot de l'app (multi-worker) ; ce
  # service les sort du runtime tout en gardant l'ergonomie de `docker compose up`
  # (l'api ci-dessous en dépend via service_completed_successfully). Hors dev,
  # voir deploy.sh (`docker compose run --rm api alembic upgrade head`) et
  # `make migrate`. Réutilise l'image api ; seul DATABASE_URL est nécessaire.
  migrate:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: chatbot-migrate
    environment:
      - DATABASE_URL=${DATABASE_URL}
    volumes:
      - ./api/src:/app/src
      - ./api/alembic.ini:/app/alembic.ini
      - ./api/alembic:/app/alembic
    depends_on:
      db:
        condition: service_healthy
    command: alembic upgrade head
    restart: "no"

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: chatbot-api
    restart: unless-stopped
    environment:
      # ENV=dev assouplit le CORS pour le dashboard local. En prod, ne PAS définir
      # ENV=dev -> seules les origines explicites (APP_URL) sont autorisées.
      # NB: les endpoints /widget/* ont leur propre contrôle d'Origin par bot
      # (whitelist de domaines), indépendant du CORS global.
      - ENV=${ENV:-dev}
      - DATABASE_URL=${DATABASE_URL}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - TURNSTILE_SITE_KEY=${TURNSTILE_SITE_KEY:-}
      - TURNSTILE_SECRET_KEY=${TURNSTILE_SECRET_KEY:-}
      - MOCK_AI=${MOCK_AI:-true}
      # ⚠ DEV UNIQUEMENT : autorise fetch_user_url à lire un WP LOCAL (loopback
      # seulement, http/https). Défaut FALSE : opt-in explicite via le .env local
      # (ALLOW_PRIVATE_FETCH=true). JAMAIS de défaut actif. Ignoré en prod
      # (la garde côté code exige aussi is_production=False).
      - ALLOW_PRIVATE_FETCH=${ALLOW_PRIVATE_FETCH:-false}
      # Démo publique « 1 URL -> chatbot » (défauts sains, surcharge optionnelle).
      - DEMO_ENABLED=${DEMO_ENABLED:-true}
      - DEMO_IP_PER_DAY=${DEMO_IP_PER_DAY:-5}
      - DEMO_GLOBAL_PER_DAY=${DEMO_GLOBAL_PER_DAY:-300}
      - DEMO_CACHE_TTL_DAYS=${DEMO_CACHE_TTL_DAYS:-14}
      # Chat IA de la démo (V2) : quotas par message.
      - DEMO_CHAT_IP_PER_DAY=${DEMO_CHAT_IP_PER_DAY:-30}
      - DEMO_CHAT_GLOBAL_PER_DAY=${DEMO_CHAT_GLOBAL_PER_DAY:-2000}
      # MOCK_BILLING=true : stripe_service n'émet aucun appel Stripe sortant
      # (checkout/portail mockés, entitlement appliqué directement). Interdit en
      # prod (validate_production). Défaut true = dev/CI sans clés Stripe.
      - MOCK_BILLING=${MOCK_BILLING:-true}
      # BILLING_ENFORCE=true : le gating bloque vraiment (402) un bot non payé /
      # essai expiré. false = mode observe (logs only). BILLING_METERING_ENABLED :
      # axe métré v2 (report d'usage Stripe), false en v1.
      - BILLING_ENFORCE=${BILLING_ENFORCE:-false}
      - BILLING_METERING_ENABLED=${BILLING_METERING_ENABLED:-false}
      - APP_URL=${APP_URL:-http://localhost:3001}
      - API_URL=${API_URL:-http://localhost:8001}
      # SSO Google : Client ID public (= audience des tokens). Vide = désactivé.
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      # Auto-login admin (dev uniquement, ignore si ENV != dev)
      - AUTO_LOGIN_ADMIN_DEV=${AUTO_LOGIN_ADMIN_DEV:-false}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-admin@kertios.com}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-Admin123!}
      # Rate-limiters partagés via Redis. Si vide (ou Redis en panne) : repli
      # mémoire fail-open -> 1 seul worker uvicorn obligatoire.
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      # SMTP (notification email des leads). HOST vide = fallback log, jamais bloquant
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_FROM=${SMTP_FROM:-}
      # Prospection commerciale (back-office superadmin). API publique gratuite
      # recherche-entreprises (SIRENE), aucune clé. Brouillon = ANTHROPIC_API_KEY
      # (ou MOCK_AI), envoi = SMTP ci-dessus. Défauts sains, surcharge optionnelle.
      - PROSPECTING_ENABLED=${PROSPECTING_ENABLED:-true}
      - RECHERCHE_ENTREPRISES_URL=${RECHERCHE_ENTREPRISES_URL:-https://recherche-entreprises.api.gouv.fr/search}
      - PROSPECT_CRAWL_MAX_PAGES=${PROSPECT_CRAWL_MAX_PAGES:-6}
      - PROSPECT_CRAWL_MAX_REDIRECTS=${PROSPECT_CRAWL_MAX_REDIRECTS:-4}
      - PROSPECT_FETCH_MAX_BYTES=${PROSPECT_FETCH_MAX_BYTES:-300000}
      # Brave Search (découverte web à la demande). Vide = web off, repli SIRENE.
      - BRAVE_SEARCH_API_KEY=${BRAVE_SEARCH_API_KEY:-}
      - PROSPECT_DISCOVER_MAX=${PROSPECT_DISCOVER_MAX:-10}
      # 2FA (TOTP + WebAuthn/passkeys). RP_ID dérivé de APP_URL si vide (host).
      # En dev (ENV=dev) l'enforcement admin ne mord pas : auto-login conservé.
      - TWOFA_ISSUER=${TWOFA_ISSUER:-Chapote}
      - TWOFA_ENFORCE_ADMIN=${TWOFA_ENFORCE_ADMIN:-true}
      - WEBAUTHN_RP_ID=${WEBAUTHN_RP_ID:-}
      - WEBAUTHN_RP_NAME=${WEBAUTHN_RP_NAME:-Chapote}
      # Stripe : SECRET_KEY + WEBHOOK_SECRET vides = billing désactivé (app 100%
      # gratuite). Le catalogue (Products/Prices) vit en base via seed_billing_catalog,
      # plus de STRIPE_PRICE_* (catalogue modulaire).
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY:-}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET:-}
      # Embeddings locaux (RAG) : cache du modele fastembed hors de /app
      # (zéro interaction avec le watcher --reload). Changer de modele peut
      # changer la dimension (la base attend vector(384)).
      - FASTEMBED_CACHE_PATH=${FASTEMBED_CACHE_PATH:-/var/cache/fastembed}
      - EMBEDDINGS_MODEL=${EMBEDDINGS_MODEL:-sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2}
      - PYTHONUNBUFFERED=1
    ports:
      - "8001:8000"
    volumes:
      - ./api/src:/app/src
      # Alembic monté en dev : `docker compose exec api alembic revision
      # --autogenerate -m "..."` écrit la révision dans ./api/alembic/versions
      # sur l'hôte (sinon elle resterait dans le conteneur).
      - ./api/alembic.ini:/app/alembic.ini
      - ./api/alembic:/app/alembic
      # Scripts utilitaires (seed du catalogue billing) montés en dev :
      # `docker compose exec api python -m scripts.seed_billing_catalog`.
      - ./api/scripts:/app/scripts
      - ./widget:/app/widget
      # Tests montés en dev : `docker compose exec api python -m pytest` direct,
      # sans docker cp (pytest est dans requirements.txt). NON copiés dans l'image.
      - ./api/tests:/app/tests
      - ./api/pytest.ini:/app/pytest.ini
      - upload_files:/app/uploads
      # Cache du modele d'embeddings (download ~100-400 Mo au premier usage) :
      # survit aux rebuilds, efface par `docker compose down -v` (re-download
      # non bloquant au prochain usage).
      - fastembed_cache:/var/cache/fastembed
    depends_on:
      # La base doit être MIGRÉE avant que l'app démarre (elle ne migre plus
      # elle-même). Le service one-shot `migrate` doit avoir fini en succès.
      migrate:
        condition: service_completed_successfully
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    # --reload impose un process unique en dev ; les rate-limiters sont
    # partagés via Redis (REDIS_URL), le repli mémoire reste sûr mono-worker.
    command: uvicorn src.main:app --host 0.0.0.0 --port 8000 --workers 1 --proxy-headers --forwarded-allow-ips='*' --reload
    # python:3.11-slim n'embarque pas curl -> healthcheck via urllib.
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health', timeout=3).status==200 else 1)\""]
      interval: 10s
      retries: 5
      start_period: 20s

  app:
    build:
      context: ./app
      dockerfile: Dockerfile
    container_name: chatbot-app
    restart: unless-stopped
    environment:
      - VITE_API_URL=${VITE_API_URL:-http://localhost:8001}
      # SSO Google : même Client ID que côté API (valeur publique). Vide = bouton masqué.
      - VITE_GOOGLE_CLIENT_ID=${VITE_GOOGLE_CLIENT_ID:-}
      # Turnstile (démo /demo) : site key publique. Défaut = TURNSTILE_SITE_KEY
      # (une seule variable pilote front+back). Vide = pas de captcha affiché.
      - VITE_TURNSTILE_SITE_KEY=${VITE_TURNSTILE_SITE_KEY:-${TURNSTILE_SITE_KEY:-}}
    ports:
      - "3001:3000"
    volumes:
      - ./app/src:/app/src
      - ./app/index.html:/app/index.html
      - ./app/vite.config.ts:/app/vite.config.ts
      - ./app/tsconfig.json:/app/tsconfig.json
    depends_on:
      api:
        condition: service_healthy
    command: bun run dev --host 0.0.0.0 --port 3000

volumes:
  postgres_data:
  redis_data:
  upload_files:
  fastembed_cache:

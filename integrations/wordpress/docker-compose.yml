# WordPress JETABLE pour tester le plugin Chapote Chatbot en local.
#
# - Le plugin (./chapote-chatbot) est monté en volume : on édite, on recharge, c'est à jour.
# - Le coeur WordPress et la base vivent dans des VOLUMES DOCKER NOMMÉS
#   (chapote_wp_core / chapote_wp_db) -> RIEN n'est écrit dans le dépôt git.
#
# Démarrage :
#   docker compose -f integrations/wordpress/docker-compose.yml up -d
#   -> Site : http://localhost:8080   |   Admin : http://localhost:8080/wp-admin
#
# Install auto + activation du plugin (sans passer par l'écran d'install) :
#   bash integrations/wordpress/setup.sh
#
# Tout supprimer (site + base) :
#   docker compose -f integrations/wordpress/docker-compose.yml down -v

services:
  db:
    image: mariadb:11
    environment:
      MARIADB_DATABASE: wordpress
      MARIADB_USER: wordpress
      MARIADB_PASSWORD: wordpress
      MARIADB_ROOT_PASSWORD: rootpwd
    volumes:
      - chapote_wp_db:/var/lib/mysql
    restart: unless-stopped

  wordpress:
    image: wordpress:6-php8.3-apache
    depends_on:
      - db
    ports:
      - "8080:80"
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DEBUG: "1"
    # Permet au conteneur de joindre l'API dev de l'hôte (http://host.docker.internal:8001)
    # si un jour on veut tester côté serveur. Le widget, lui, est chargé par le NAVIGATEUR.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - chapote_wp_core:/var/www/html
      - ./chapote-chatbot:/var/www/html/wp-content/plugins/chapote-chatbot
    restart: unless-stopped

  # Service outil (WP-CLI) : ne démarre QUE via `--profile cli` (cf. setup.sh).
  wpcli:
    image: wordpress:cli-php8.3
    profiles: ["cli"]
    depends_on:
      - db
      - wordpress
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
      WORDPRESS_DB_NAME: wordpress
    user: "33:33" # www-data
    volumes:
      - chapote_wp_core:/var/www/html
      - ./chapote-chatbot:/var/www/html/wp-content/plugins/chapote-chatbot

volumes:
  chapote_wp_db:
  chapote_wp_core:

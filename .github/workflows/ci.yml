# Intégration continue — supprime le « faux-vert » (PR-15).
#
# Avant cette CI, .github/workflows/ ne contenait que deploy.yml : AUCUN job ne
# lançait pytest ni les e2e. Les ~320 tests pytest (dont les 161 real_db du
# harness PR-10) et les e2e billing « protégeaient » donc le code sans jamais
# tourner automatiquement — un faux-vert intégral. Ce workflow câble une vraie
# CI, sur push et PR vers master.
#
# Deux jobs :
#   - pytest       : suite backend sur une VRAIE base Postgres (image pgvector,
#                    pour l'extension `vector`), REQUIRE_REAL_DB=1 (les tests
#                    real_db S'EXÉCUTENT, échec dur si la DB manque — pas de skip).
#   - e2e-billing  : stack docker compose complète avec le billing ARMÉ
#                    (fausses clés Stripe + MOCK_BILLING + BILLING_ENFORCE), puis
#                    les specs billing-*.spec.ts qui DOIVENT s'exécuter (un garde
#                    échoue si elles skippent — c'est le faux-vert qu'on retire).
#
# Voir docs/CI.md pour la matrice complète (jobs / env / décisions).
name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# Annule les runs obsolètes d'une même branche/PR (économie de runners).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # JOB 1 — pytest backend sur vraie base Postgres (harness real_db PR-10).
  # ---------------------------------------------------------------------------
  pytest:
    runs-on: ubuntu-latest

    services:
      # IMPÉRATIF : image pgvector (pas postgres:16 standard) — le harness
      # real_db pose `CREATE EXTENSION vector` (colonne kb_chunks.embedding) et
      # `unaccent` (colonne générée kb_chunks.tsv). postgres:16 nu échouerait sur
      # l'extension vector (bug de schéma => rouge, pas un skip).
      postgres:
        image: pgvector/pgvector:pg16
        env:
          # real_db._create_database_if_absent() se connecte d'abord à cette base
          # « de maintenance » (chatbot_saas) pour CREATE DATABASE chatbot_saas_test.
          # L'utilisateur POSTGRES_USER de l'image est superuser => droit CREATE DB.
          POSTGRES_USER: chatbot
          POSTGRES_PASSWORD: chatbot_secret
          POSTGRES_DB: chatbot_saas
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U chatbot -d chatbot_saas"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # DATABASE_URL pointe le service Postgres. real_db dérive l'URL de la base
      # de test (chatbot_saas_test) en remplaçant seulement le nom de base.
      DATABASE_URL: postgresql+asyncpg://chatbot:chatbot_secret@localhost:5432/chatbot_saas
      # REQUIRE_REAL_DB=1 : une DB injoignable devient un ÉCHEC DUR (pytest.fail)
      # au lieu d'un skip gracieux => la CI GARANTIT que les tests real_db tournent.
      REQUIRE_REAL_DB: "1"
      # Aucun appel IA / Stripe sortant.
      MOCK_AI: "true"
      MOCK_BILLING: "true"
      # Secrets factices de test (ENV=dev => validate_production ne mord pas, mais
      # on fournit des valeurs valides : ENCRYPTION_KEY = clé Fernet réelle).
      ENV: dev
      JWT_SECRET_KEY: ci-test-secret-key-minimum-32-caracteres-ok
      ENCRYPTION_KEY: b3xn1mFk-ECyWePnnRULioHFgFBQkDNwhSN_-K-IIds=
      # CRITIQUE (correctif du PermissionError /app). La suite est conçue pour
      # tourner DANS l'image API (WORKDIR /app) ; ici elle tourne sur le runner NU.
      # Au chargement du conftest, `import src.main` exécute (au niveau module)
      # `Path(settings.UPLOAD_DIR).mkdir(parents=True, exist_ok=True)` avec le
      # défaut `/app/uploads` => `/app` inexistant/non inscriptible => PermissionError
      # [Errno 13] (cause exacte de l'exit 4). On redirige UPLOAD_DIR vers un
      # dossier INSCRIPTIBLE (l'app le crée elle-même). C'est le SEUL chemin /app
      # écrit à l'import (fastembed est paresseux : `_model=None`, jamais chargé
      # au startup ni par aucun test). FASTEMBED_CACHE_PATH est redirigé par
      # prudence (défaut /var/cache/fastembed, non inscriptible sur le runner).
      UPLOAD_DIR: /tmp/ci-uploads
      FASTEMBED_CACHE_PATH: /tmp/ci-fastembed

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: api/requirements.txt

      - name: Installer les dépendances
        run: |
          # pdftoppm (poppler-utils) : rendu des aperçus de la boutique de partitions
          sudo apt-get update -q && sudo apt-get install -y -q poppler-utils
          pip install -r api/requirements.txt

      - name: pytest (vraie base Postgres, real_db forcé)
        working-directory: api
        # `python -m pytest` (et non `pytest`) : ajoute api/ à sys.path
        # (import src.main). Les deux ex-« rouges billing » (prorata / downgrade)
        # sont désormais corrigés (assertion always_invoice + mock de
        # schedule_subscription_downgrade, plus d'appel Stripe réel) : ils tournent
        # dans la suite. Tout échec casse le build.
        run: |
          python -m pytest -q

  # ---------------------------------------------------------------------------
  # JOB 2 — e2e billing : stack complète, billing ARMÉ, specs qui NE SKIPPENT PAS.
  # ---------------------------------------------------------------------------
  e2e-billing:
    runs-on: ubuntu-24.04  # Playwright ne supporte pas encore ubuntu 26.04 (ubuntu-latest)
    # Job BLOQUANT : la stack est armée (billing_enabled via clés Stripe factices,
    # MOCK_BILLING=true => zéro appel sortant, BILLING_ENFORCE=True, admin dev seedé
    # pour dev-login). Vert observé sur le run de PR-25 (les specs d'enforcement
    # s'exécutent et passent ; cf. garde ci-dessous). Le job `pytest` reste le
    # second gate (320 tests dont 161 real_db).

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Écrire le .env de la stack (billing ARMÉ)
        # docker compose substitue ${VAR} depuis ce .env. Clés Stripe FACTICES :
        # billing_enabled() = bool(SECRET && WEBHOOK) => True, donc les specs
        # billing s'exécutent ; MOCK_BILLING=true => AUCUN appel Stripe sortant
        # (checkout/portail/abonnement mockés, entitlement projeté directement).
        # BILLING_ENFORCE=True => le gating mord vraiment (402) => billing-degradation
        # exerce son invariant. ENCRYPTION_KEY = clé Fernet valide.
        run: |
          cat > .env <<'EOF'
          ENV=dev
          AUTO_LOGIN_ADMIN_DEV=true
          POSTGRES_USER=chatbot
          POSTGRES_PASSWORD=chatbot_secret
          POSTGRES_DB=chatbot_saas
          DATABASE_URL=postgresql+asyncpg://chatbot:chatbot_secret@db:5432/chatbot_saas
          JWT_SECRET_KEY=ci-test-secret-key-minimum-32-caracteres-ok
          ENCRYPTION_KEY=b3xn1mFk-ECyWePnnRULioHFgFBQkDNwhSN_-K-IIds=
          MOCK_AI=true
          MOCK_BILLING=true
          BILLING_ENFORCE=True
          STRIPE_SECRET_KEY=sk_test_ci_fake_no_outbound_calls
          STRIPE_WEBHOOK_SECRET=whsec_ci_fake
          VITE_API_URL=http://localhost:8001
          EOF

      - name: Démarrer la stack (db + redis + api + app)
        # --wait : bloque jusqu'à ce que les services AVEC healthcheck (db, redis,
        # api) soient « healthy ». app n'a pas de healthcheck (attente manuelle
        # plus bas).
        run: docker compose up -d --build --wait

      - name: Attendre l'app (Vite, port 3001 sans healthcheck)
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:3001 >/dev/null; then echo "app prête"; exit 0; fi
            sleep 2
          done
          echo "::error::app (3001) injoignable" ; docker compose logs app ; exit 1

      - name: Seeder le catalogue de facturation
        # Pose les Products/Prices en base (GET /api/billing/catalog). MOCK_BILLING
        # => seed local, aucun objet Stripe distant créé.
        run: docker compose exec -T api python -m scripts.seed_billing_catalog

      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Installer Playwright + Chromium
        working-directory: e2e
        run: |
          npm install
          npx playwright install --with-deps chromium

      - name: e2e billing (doit s'exécuter, PAS skipper)
        working-directory: e2e
        env:
          E2E_API_URL: http://localhost:8001
        # Rapport JSON pour le garde anti-skip de l'étape suivante. Le filtre
        # positionnel `billing-` cible billing-*.spec.ts (dont catalog-parity).
        run: |
          PLAYWRIGHT_JSON_OUTPUT_NAME=billing-report.json \
            npx playwright test billing- --reporter=json

      - name: Garde anti-faux-vert (échec si AUCUN test billing n'a tourné)
        working-directory: e2e
        # Cœur de PR-15 : avant, TOUTES les specs billing skippaient silencieusement
        # quand billing OFF et la CI restait verte sans rien prouver. Ici billing est
        # ARMÉ : les specs d'enforcement/gating S'EXÉCUTENT (et passent). On CASSE le
        # build si AUCUNE spec billing n'a tourné (= armement raté => faux-vert) ou
        # si un test a échoué. Les specs qui exigent un VRAI Stripe (checkout réel,
        # webhooks signés, subscription_schedules) skippent légitimement en CI
        # hermétique => warning, pas échec.
        run: |
          node -e '
            const r = require("./billing-report.json");
            const s = r.stats || {};
            console.log("stats:", JSON.stringify(s));
            if ((s.unexpected || 0) > 0) {
              console.error((s.unexpected) + " test(s) billing en échec.");
              process.exit(1);
            }
            if ((s.expected || 0) < 1) {
              console.error("FAUX-VERT : aucun test billing exécuté (armement billing raté ou filtre cassé).");
              process.exit(1);
            }
            if ((s.skipped || 0) > 0) {
              console.warn("Note : " + s.skipped + " spec(s) billing skippée(s) (besoin d un vrai Stripe, non simulable en CI).");
            }
            console.log("OK : " + s.expected + " test(s) billing exécuté(s), " + (s.skipped||0) + " skip légitime(s).");
          '

      - name: Logs de la stack (si échec)
        if: failure()
        run: docker compose logs --tail 200

      - name: Arrêter la stack
        if: always()
        run: docker compose down -v

  # ---------------------------------------------------------------------------
  # JOB — PHPUnit du plugin WordPress (finding WP-01, Élevé). Avant, AUCUN job ne
  # touchait le PHP : toute la frontière de sécurité du plugin (crypto
  # AES-256-GCM des tokens OAuth, garde permission+nonce du proxy REST, anti-CSRF
  # state + S256 du flux PKCE) était livrée sans un seul test automatisé. Ce job
  # installe PHP + Composer et exécute le harness `integrations/wordpress/` (stubs
  # WP maison, openssl natif pour la crypto) en gate. Couverture MINIMALE mais
  # significative ; l'extension de couverture du plugin = PR-16/PR-17.
  # ---------------------------------------------------------------------------
  wp-plugin:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: PHP 8.3 (+ openssl/mbstring requis par la crypto AES-256-GCM)
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: openssl, mbstring
          coverage: none
          tools: composer:v2

      - name: Installer les dépendances (PHPUnit)
        working-directory: integrations/wordpress
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: PHPUnit (frontière de sécurité du plugin)
        working-directory: integrations/wordpress
        run: ./vendor/bin/phpunit

  # ---------------------------------------------------------------------------
  # JOB 3 — e2e COMPLÈTE (billing OFF) : exécute TOUTE la suite Playwright, pas
  # seulement les billing-* (findings APP-01/APP-02). Avant, le seul job e2e
  # filtrait `billing-` => 22 des 28 specs (widget, actions, kb, triggers,
  # profil, permissions, wizard, savebar…) ne tournaient JAMAIS en CI.
  #
  # POURQUOI billing OFF (et NON le job armé) : sans clés Stripe,
  # billing_enabled()==False => resolver ALL_UNLOCKED (invariant D0, « tout
  # gratuit »). C'est la condition sous laquelle ces 22 specs ont été écrites et
  # restent VERTES (« 32 e2e historiques verts »). Lancées dans le job ARMÉ
  # (BILLING_ENFORCE), les specs qui touchent un module payant échoueraient pour
  # une raison d'ENV, PAS un bug :
  #   - actions / kb => 402 module_required (Actions / RAG) au save ;
  #   - ab           => bloc A/B verrouillé (module AB) ;
  #   - inbox-live   => handoff gaté (module INBOX) : le widget reste en TREE ;
  #   - wizard-tree  => étape « plan » insérée (libellé du bouton différent).
  # Sous billing OFF ces gates disparaissent => specs vertes. Les specs billing-*
  # d'enforcement se `skip` alors d'elles-mêmes (billing OFF) : elles sont
  # exercées POUR DE VRAI par le job `e2e-billing` (armé) ci-dessus. Union des
  # deux jobs = couverture e2e totale.
  # ---------------------------------------------------------------------------
  e2e-full:
    runs-on: ubuntu-24.04  # Playwright ne supporte pas encore ubuntu 26.04 (ubuntu-latest)

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Écrire le .env de la stack (billing OFF — invariant D0)
        # AUCUNE clé Stripe => billing_enabled()==False => ALL_UNLOCKED : zéro 402
        # module_required, les 22 specs « non-billing » passent, et les billing-*
        # d'enforcement se skip légitimement (couvertes par e2e-billing). MOCK_AI
        # =true : la suite n'emprunte aucun chemin IA (bots tree/hybrid, widget IA
        # jamais ouvert), mais on coupe par sécurité tout appel provider sortant.
        run: |
          cat > .env <<'EOF'
          ENV=dev
          AUTO_LOGIN_ADMIN_DEV=true
          POSTGRES_USER=chatbot
          POSTGRES_PASSWORD=chatbot_secret
          POSTGRES_DB=chatbot_saas
          DATABASE_URL=postgresql+asyncpg://chatbot:chatbot_secret@db:5432/chatbot_saas
          JWT_SECRET_KEY=ci-test-secret-key-minimum-32-caracteres-ok
          ENCRYPTION_KEY=b3xn1mFk-ECyWePnnRULioHFgFBQkDNwhSN_-K-IIds=
          MOCK_AI=true
          MOCK_BILLING=true
          VITE_API_URL=http://localhost:8001
          EOF

      - name: Démarrer la stack (db + redis + api + app)
        # --wait : bloque jusqu'à ce que db, redis et api soient « healthy ».
        run: docker compose up -d --build --wait

      - name: Attendre l'app (Vite, port 3001 sans healthcheck)
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:3001 >/dev/null; then echo "app prête"; exit 0; fi
            sleep 2
          done
          echo "::error::app (3001) injoignable" ; docker compose logs app ; exit 1

      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Installer Playwright + Chromium
        working-directory: e2e
        run: |
          npm install
          npx playwright install --with-deps chromium

      - name: e2e COMPLÈTE (toute la suite, AUCUN filtre)
        working-directory: e2e
        env:
          E2E_API_URL: http://localhost:8001
        # Cœur de PR-04 : `npx playwright test` SANS argument positionnel => les
        # 28 specs tournent (vs `billing-` qui n'en lançait que 7). Reporter list
        # (logs lisibles) + json (rapport pour le garde de l'étape suivante).
        run: |
          PLAYWRIGHT_JSON_OUTPUT_NAME=full-report.json \
            npx playwright test --reporter=list,json

      - name: Garde anti-faux-vert (suite complète exécutée, zéro échec)
        working-directory: e2e
        # Trois invariants cassent le build :
        #  1. un test a échoué (unexpected > 0) ;
        #  2. la suite n'a pas été COLLECTÉE en entier (total < 40) — détecte un
        #     filtre `billing-` réintroduit par erreur (qui retomberait à ~9) ou
        #     une suite tronquée ;
        #  3. trop peu de tests ont réellement PASSÉ (expected < 25) — détecte un
        #     faux-vert où tout se serait skippé (stack non démarrée / D0 raté).
        # Référence observée sous billing OFF : ~38 passés / ~8 skip (billing-*
        # OFF) / 0 échec sur 46 tests collectés. Bumper les seuils si la suite
        # grossit.
        run: |
          node -e '
            const r = require("./full-report.json");
            const s = r.stats || {};
            const total = (s.expected||0)+(s.skipped||0)+(s.unexpected||0)+(s.flaky||0);
            console.log("stats:", JSON.stringify(s), "total:", total);
            if ((s.unexpected||0) > 0) {
              console.error((s.unexpected) + " test(s) e2e en échec.");
              process.exit(1);
            }
            if (total < 40) {
              console.error("Suite tronquée : " + total + " test(s) collecté(s) (<40) — filtre billing- réintroduit ?");
              process.exit(1);
            }
            if ((s.expected||0) < 25) {
              console.error("FAUX-VERT : seulement " + (s.expected||0) + " test(s) passé(s) (<25) — D0 mal armé ?");
              process.exit(1);
            }
            if ((s.flaky||0) > 0) console.warn("Note : " + s.flaky + " test(s) flaky (passés au retry).");
            console.log("OK : " + s.expected + " passés, " + (s.skipped||0) + " skip (billing-* OFF, couverts par e2e-billing), " + total + " collectés.");
          '

      - name: Logs de la stack (si échec)
        if: failure()
        run: docker compose logs --tail 200

      - name: Arrêter la stack
        if: always()
        run: docker compose down -v

<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <meta name="robots" content="noindex" />
    <title>Chapote CM</title>
    <style>
      :root { --bg: #fafaf9; --fg: #1c1917; --muted: #78716c; }
      @media (prefers-color-scheme: dark) { :root { --bg: #0c0a09; --fg: #f5f5f4; --muted: #a8a29e; } }
      html, body { height: 100%; margin: 0; }
      body { display: grid; place-items: center; background: var(--bg); color: var(--fg);
             font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
      main { text-align: center; padding: 24px; }
      h1 { font-size: 20px; font-weight: 600; margin: 0 0 4px; letter-spacing: -0.01em; }
      p { margin: 0; color: var(--muted); }
    </style>
  </head>
  <body>
    <main>
      <h1>Chapote CM</h1>
      <p>Bientôt disponible.</p>
    </main>
  </body>
</html>

# cm.chapote.fr — le reverse proxy de l'hôte (TLS) envoie tout ici.
# Modèle : l'image nginx remplace ${CM_PROXY_KEY} au démarrage (envsubst, variables définies seulement).

map $uri $cm_cache_control {
    ~^/assets/  "public, max-age=31536000, immutable";
    ~^/api/     "";
    default     "no-cache";
}

# Journal sans paramètres d'URL (codes OAuth, liens signés).
log_format cm_sans_params '$remote_addr - [$time_local] "$request_method $uri $server_protocol" '
                          '$status $body_bytes_sent "$http_user_agent"';

server {
    listen 80;
    access_log /var/log/nginx/access.log cm_sans_params;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    # Compression (le JS et le CSS gagnent ~70 %) ; la police woff2 est déjà compressée.
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;
    # Vidéos envoyées par morceaux de 8 Mio.
    client_max_body_size 10m;

    set_real_ip_from 127.0.0.1;
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    add_header Cache-Control $cm_cache_control always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https:; media-src 'self' blob:; style-src 'self' 'unsafe-inline' https://accounts.google.com/gsi/style; font-src 'self'; script-src 'self' https://accounts.google.com/gsi/client; frame-src https://accounts.google.com/gsi/; connect-src 'self' https://accounts.google.com/gsi/; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

    # API du site (planning, statistiques, Instagram, routine) + modules TikTok et YouTube.
    location ~ ^/api/(cm|tiktok|youtube)/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Cm-Client-IP $remote_addr;
        proxy_set_header X-Cm-Proxy-Key "${CM_PROXY_KEY}";
        proxy_request_buffering off;
        # Vidéos téléchargées par Instagram et par la routine : pas de mise en mémoire tampon.
        proxy_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
    # Compte partagé avec chapote.fr : seules ces routes d'authentification sont exposées ici.
    location ~ ^/api/auth/(login|register|google|logout|me|verify-email/request|password/forgot|2fa/login/totp|2fa/login/recovery)$ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Cm-Client-IP $remote_addr;
        proxy_set_header X-Cm-Proxy-Key "${CM_PROXY_KEY}";
    }
    location /api/ { return 404; }

    location /assets/ {
        try_files $uri =404;
    }
    location / {
        try_files $uri /index.html;
    }
}

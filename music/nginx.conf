# music.chapote.fr — le reverse proxy de l'hôte (TLS) envoie tout ici.
# Modèle : l'image nginx remplace la variable de la clé partagée au démarrage (envsubst, variables définies seulement).

# Cache : fichiers versionnés gardés un an ; pages (index.html) jamais gardées, pour qu'un déploiement se voie tout de suite ;
# réponses de l'API : leur propre en-tête (valeur vide = pas d'en-tête ajouté). Posé au niveau du serveur pour garder
# les en-têtes de sécurité (un add_header dans une location les ferait perdre).
map $uri $music_cache_control {
    ~^/assets/  "public, max-age=31536000, immutable";
    ~^/api/     "";
    default     "no-cache";
}

# Journal d'accès sans paramètres d'URL ni page d'origine : les liens de commande et de téléchargement
# portent une clé d'accès (?k=…) qui ne doit pas rester dans les journaux.
log_format music_sans_cles '$remote_addr - [$time_local] "$request_method $uri $server_protocol" '
                           '$status $body_bytes_sent "$http_user_agent"';

server {
    listen 80;
    access_log /var/log/nginx/access.log music_sans_cles;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;
    client_max_body_size 30m;

    # Vraie IP du visiteur : transmise par le reverse proxy de l'hôte (seul point d'entrée,
    # port lié à 127.0.0.1), puis relayée à l'API (qui fait confiance à ce conteneur).
    set_real_ip_from 127.0.0.1;
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    add_header Cache-Control $music_cache_control always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https://*.googleusercontent.com; style-src 'self' 'unsafe-inline' https://accounts.google.com/gsi/style; script-src 'self' https://accounts.google.com/gsi/client; frame-src https://accounts.google.com/gsi/; connect-src 'self' https://accounts.google.com/gsi/; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

    # API de la boutique (catalogue, aperçus, commande, téléchargements, webhook Stripe)
    # suivi des visites : petits lots seulement
    location = /api/music/track {
        client_max_body_size 32k;
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Music-Client-IP $remote_addr;
        proxy_set_header X-Music-Proxy-Key "${MUSIC_PROXY_KEY}";
    }
    location /api/music/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Music-Client-IP $remote_addr;
        proxy_set_header X-Music-Proxy-Key "${MUSIC_PROXY_KEY}";
        proxy_read_timeout 120s;
    }
    # Compte partagé avec chapote.fr (connexion, inscription, Google, déconnexion, profil) :
    # seules ces routes d'authentification sont exposées ici.
    location ~ ^/api/auth/(login|register|google|logout|me|verify-email/request|password|password/forgot)$ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Music-Client-IP $remote_addr;
        proxy_set_header X-Music-Proxy-Key "${MUSIC_PROXY_KEY}";
    }
    # Le reste de l'API n'est pas exposé sur ce domaine.
    location /api/ { return 404; }

    location /assets/ {
        try_files $uri =404;
    }
    location / {
        try_files $uri /index.html;
    }
}

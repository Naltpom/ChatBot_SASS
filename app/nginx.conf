# Conf nginx du dashboard buildé (montée en /etc/nginx/conf.d/default.conf).

# Porte de maintenance : généré au démarrage du conteneur par
# /docker-entrypoint.d/40-maintenance-gate.sh à partir de MAINTENANCE_MODE et
# ALLOW_MAINTENANCE_IPS (.env). Définit $under_maintenance (1 = bloqué).
# Contexte http (inclus hors du bloc server).
include /etc/nginx/maintenance_gate.conf;

# Journal sans paramètres d'URL : les retours OAuth (?code=…&state=… de Google, TikTok, Meta) et les
# liens signés n'y sont jamais écrits (politiques de confidentialité, « journaux sans jeton »).
log_format app_sans_params '$remote_addr - [$time_local] "$request_method $uri $server_protocol" '
                           '$status $body_bytes_sent "$http_user_agent"';

server {
    listen 80;
    server_name _;
    access_log /var/log/nginx/access.log app_sans_params;

    root /usr/share/nginx/html;
    index index.html;

    # Vraie IP client derrière le reverse proxy (TLS) de l'hôte : on fait
    # confiance aux réseaux privés (le conteneur n'est joignable que via le
    # proxy). $remote_addr devient alors l'IP réelle utilisée par la geo.
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    set_real_ip_from 127.0.0.1;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # En-tetes de securite globaux (audit §4.8). Le dashboard ne doit JAMAIS
    # etre embarque -> X-Frame-Options DENY + frame-ancestors 'none'
    # (anti-clickjacking). CSP alignee a l'IDENTIQUE sur le middleware API
    # (api/src/main.py DASHBOARD_CSP). Origines tierces reellement chargees :
    #   - script-src : hash de l'IIFE anti-flash inline (index.html) +
    #     Turnstile (captcha /demo) — PAS de 'unsafe-inline' sur les scripts ;
    #   - style-src 'unsafe-inline' : styles inline massifs de l'app React
    #     (style={{...}}) + Google Fonts + Fontshare (feuilles distantes) ;
    #   - font-src : Google Fonts (gstatic) + Fontshare (cdn) ;
    #   - frame-src : iframe Turnstile ; connect-src https: : API sur origine
    #     DISTINCTE (VITE_API_URL) inconnue a la compile + POST Turnstile.
    # NB : aucun bloc widget/asset embarquable n'est servi par ce conteneur
    # (le widget vit cote API), donc le DENY est sans risque ici.
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-+rn9zAXD0btXkTbfuB8S0nuhugvmkoMuK9AQce4NwJ0=' https://challenges.cloudflare.com https://accounts.google.com/gsi/client; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://api.fontshare.com https://accounts.google.com/gsi/style; img-src 'self' data: https:; media-src 'self' blob:; font-src 'self' data: https://fonts.gstatic.com https://cdn.fontshare.com; connect-src 'self' https:; frame-src https://challenges.cloudflare.com https://accounts.google.com/gsi/; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
    # HSTS : le TLS est termine par le reverse proxy de l'hote (prod uniquement).
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Page de maintenance : servie en 503 (SEO-safe, pas de désindexation) à
    # tout le monde SAUF les IP autorisées. Auto-contenue (aucun asset externe).
    error_page 503 /maintenance.html;
    location = /maintenance.html {
        internal;
        add_header Retry-After 3600 always;
        add_header Cache-Control "no-store" always;
        # add_header dans un location annule ceux du server -> on repose le set
        # de securite (la page 503 doit rester anti-clickjacking comme le reste).
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-+rn9zAXD0btXkTbfuB8S0nuhugvmkoMuK9AQce4NwJ0=' https://challenges.cloudflare.com https://accounts.google.com/gsi/client; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://api.fontshare.com https://accounts.google.com/gsi/style; img-src 'self' data: https:; media-src 'self' blob:; font-src 'self' data: https://fonts.gstatic.com https://cdn.fontshare.com; connect-src 'self' https:; frame-src https://challenges.cloudflare.com https://accounts.google.com/gsi/; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }

    # Assets fingerprintés par Vite : cache long immuable.
    # NB : add_header dans un location annule ceux du server -> on les repose.
    location /assets/ {
        if ($under_maintenance) { return 503; }
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        # add_header dans un location annule ceux du server -> on repose le set.
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-+rn9zAXD0btXkTbfuB8S0nuhugvmkoMuK9AQce4NwJ0=' https://challenges.cloudflare.com https://accounts.google.com/gsi/client; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://api.fontshare.com https://accounts.google.com/gsi/style; img-src 'self' data: https:; media-src 'self' blob:; font-src 'self' data: https://fonts.gstatic.com https://cdn.fontshare.com; connect-src 'self' https:; frame-src https://challenges.cloudflare.com https://accounts.google.com/gsi/; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }

    # index.html prérendu (« / » + fallback SPA) : peut changer à chaque build,
    # donc PAS de cache long. Revalidation courte (les assets fingerprintés, eux,
    # sont en cache immuable via /assets/).
    location = /index.html {
        if ($under_maintenance) { return 503; }
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
        # add_header dans un location annule ceux du server -> on repose le set.
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-+rn9zAXD0btXkTbfuB8S0nuhugvmkoMuK9AQce4NwJ0=' https://challenges.cloudflare.com https://accounts.google.com/gsi/client; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://api.fontshare.com https://accounts.google.com/gsi/style; img-src 'self' data: https:; media-src 'self' blob:; font-src 'self' data: https://fonts.gstatic.com https://cdn.fontshare.com; connect-src 'self' https:; frame-src https://challenges.cloudflare.com https://accounts.google.com/gsi/; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }

    # Redirect OAuth TikTok (/tiktok/callback ; /tiktok redirige côté SPA vers
    # /app/tiktok) : page de la SPA, jamais indexée et sans Referer (le code
    # OAuth transite dans l'URL du callback). 200 direct sur /tiktok/callback,
    # sans redirection ni slash final.
    location ^~ /tiktok {
        if ($under_maintenance) { return 503; }
        try_files /index.html =404;
        add_header Cache-Control "no-store" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        # add_header dans un location annule ceux du server -> on repose le set.
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy no-referrer always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-+rn9zAXD0btXkTbfuB8S0nuhugvmkoMuK9AQce4NwJ0=' https://challenges.cloudflare.com https://accounts.google.com/gsi/client; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://api.fontshare.com https://accounts.google.com/gsi/style; img-src 'self' data: https:; media-src 'self' blob:; font-src 'self' data: https://fonts.gstatic.com https://cdn.fontshare.com; connect-src 'self' https:; frame-src https://challenges.cloudflare.com https://accounts.google.com/gsi/; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }

    # Redirect OAuth Google du module YouTube (/youtube/callback) : mêmes
    # règles que /tiktok (jamais indexée, sans Referer : le code OAuth transite
    # dans l'URL).
    location ^~ /youtube {
        if ($under_maintenance) { return 503; }
        try_files /index.html =404;
        add_header Cache-Control "no-store" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        # add_header dans un location annule ceux du server -> on repose le set.
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy no-referrer always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-+rn9zAXD0btXkTbfuB8S0nuhugvmkoMuK9AQce4NwJ0=' https://challenges.cloudflare.com https://accounts.google.com/gsi/client; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://api.fontshare.com https://accounts.google.com/gsi/style; img-src 'self' data: https:; media-src 'self' blob:; font-src 'self' data: https://fonts.gstatic.com https://cdn.fontshare.com; connect-src 'self' https:; frame-src https://challenges.cloudflare.com https://accounts.google.com/gsi/; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }

    # SPA : toute route inconnue retombe sur index.html (react-router).
    location / {
        if ($under_maintenance) { return 503; }
        try_files $uri $uri/ /index.html;
    }
}

    <!-- Twitter -->

    <meta name="twitter:image" content="https://chapote.fr/brand/logo-horizontal.svg" />

    <!-- JSON-LD : organisation + site (SEO / rich results). Véridique :
         Chapote = chatbot SaaS hybride français, https://chapote.fr -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "Organization",
          "@id": "https://chapote.fr/#organization",
          "name": "Chapote",
          "url": "https://chapote.fr/",
          "logo": "https://chapote.fr/brand/logo-horizontal.svg",
          "description": "Chapote est un chatbot hybride français : arbre guidé illimité, IA plafonnée et relais humain, en une seule balise. RGPD par défaut, hébergement français."
        },
        {
          "@type": "WebSite",
          "@id": "https://chapote.fr/#website",
          "url": "https://chapote.fr/",
          "name": "Chapote",
          "inLanguage": "fr-FR",
          "publisher": { "@id": "https://chapote.fr/#organization" }
        }
      ]
    }
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <!-- Chapote display font (Clash Display) -->
    <link href="https://api.fontshare.com/v2/css?f[]=clash-display@400,500,600,700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Anti-flash : les routes NON prérendues sont servies par le fallback SPA
      // nginx -> le MÊME index.html que « / », dont #root contient le markup
      // Landing pré-rendu. On vide #root avant le bundle pour éviter un flash de
      // la Landing sur /login, /app/*, etc. Ce script s'exécute AVANT le bundle,
      // il ne peut pas importer de module : il garde une copie de la liste —
      // source unique = src/prerenderRoutes.ts (PRERENDERED_PATHS).
      (function () {
        var PRE = ['/', '/showcase'];
        var p = location.pathname.replace(/\/+$/, '') || '/';
        if (PRE.indexOf(p) === -1) { var r = document.getElementById('root'); if (r) r.innerHTML = ''; }
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

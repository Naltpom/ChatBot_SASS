  <body>
    <div id="root"></div>
    <script>
      // Anti-flash : les routes NON prérendues sont servies par le fallback SPA
      // nginx -> le MÊME index.html que « / », dont #root contient le markup
      // Landing pré-rendu. On vide #root avant le bundle pour éviter un flash de
      // la Landing sur /login, /app/*, etc. Ce script s'exécute AVANT le bundle,
      // il ne peut pas importer de module : il garde une copie de la liste —
      // source unique = src/prerenderRoutes.ts (PRERENDERED_PATHS).
      (function () {
        var PRE = ['/', '/showcase', '/a-propos'];
        var p = location.pathname.replace(/\/+$/, '') || '/';
        if (PRE.indexOf(p) === -1) { var r = document.getElementById('root'); if (r) r.innerHTML = ''; }
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
